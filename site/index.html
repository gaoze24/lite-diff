<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lite Diff</title>
  <meta name="description" content="轻量的在线文本对比工具，所有计算都在浏览器本地完成。">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23222'/%3E%3Crect x='6' y='9' width='20' height='5' rx='1.5' fill='%23e5534b'/%3E%3Crect x='6' y='18' width='20' height='5' rx='1.5' fill='%2346a758'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    // Theme and language before first paint. Language: ?lang= > saved choice > browser.
    (function () {
      var root = document.documentElement, saved = {};
      try {
        saved.theme = localStorage.getItem('litediff:theme');
        saved.lang = localStorage.getItem('litediff:lang');
      } catch (e) {}
      if (saved.theme) root.dataset.theme = saved.theme;
      var q = new URLSearchParams(location.search).get('lang');
      var browser = /^zh\b/i.test(navigator.language || '') ? 'zh' : 'en';
      var lang = q === 'zh' || q === 'en' ? q : saved.lang === 'zh' || saved.lang === 'en' ? saved.lang : browser;
      root.dataset.lang = lang;
      // The markup is Chinese; hide it until app.js has translated it.
      if (lang !== 'zh') { root.lang = 'en'; root.classList.add('i18n-pending'); }
    })();
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><i></i><i></i></span>
      <h1>Lite Diff</h1>
    </div>
    <span class="tagline" data-i18n="tagline">文本对比，全部在本地完成</span>
    <div class="grow"></div>
    <button class="btn ghost" id="sample-btn" type="button" data-i18n="sample">示例</button>
    <button class="btn ghost" id="lang-btn" type="button" data-i18n="langSwitch" data-i18n-title="langSwitchTitle" title="Switch to English">EN</button>
    <button class="btn ghost icon" id="theme-btn" type="button"></button>
  </header>

  <main>
    <section class="inputs">
      <div class="pane" data-side="a">
        <div class="pane-head">
          <span class="dot del" aria-hidden="true"></span>
          <input class="name" id="name-a" placeholder="原文本" spellcheck="false" aria-label="左侧名称" data-i18n-ph="nameA" data-i18n-aria="nameALabel">
          <label class="btn small"><span data-i18n="open">打开</span><input type="file" id="file-a" hidden></label>
          <button class="btn small ghost" type="button" data-clear="a" data-i18n="clear">清空</button>
        </div>
        <textarea id="text-a" spellcheck="false" placeholder="粘贴原文本，或把文件拖到这里" data-i18n-ph="placeholderA"></textarea>
      </div>
      <button class="btn swap" id="swap-btn" type="button" title="交换左右" aria-label="交换左右" data-i18n-title="swap" data-i18n-aria="swap">⇄</button>
      <div class="pane" data-side="b">
        <div class="pane-head">
          <span class="dot ins" aria-hidden="true"></span>
          <input class="name" id="name-b" placeholder="新文本" spellcheck="false" aria-label="右侧名称" data-i18n-ph="nameB" data-i18n-aria="nameBLabel">
          <label class="btn small"><span data-i18n="open">打开</span><input type="file" id="file-b" hidden></label>
          <button class="btn small ghost" type="button" data-clear="b" data-i18n="clear">清空</button>
        </div>
        <textarea id="text-b" spellcheck="false" placeholder="粘贴新文本，或把文件拖到这里" data-i18n-ph="placeholderB"></textarea>
      </div>
    </section>

    <section class="toolbar" id="toolbar">
      <div class="seg" role="radiogroup" aria-label="视图" data-i18n-aria="view">
        <label><input type="radio" name="view" value="split"><span data-i18n="split">并排</span></label>
        <label><input type="radio" name="view" value="unified"><span data-i18n="unified">合并</span></label>
      </div>
      <div class="seg" role="radiogroup" aria-label="行内高亮" data-i18n-aria="inline">
        <label><input type="radio" name="inline" value="word"><span data-i18n="word">按词</span></label>
        <label><input type="radio" name="inline" value="char"><span data-i18n="char">按字符</span></label>
        <label><input type="radio" name="inline" value="off"><span data-i18n="off">不高亮</span></label>
      </div>
      <label class="check"><input type="checkbox" id="opt-ws"><span data-i18n="ignoreWs">忽略空白</span></label>
      <label class="check"><input type="checkbox" id="opt-case"><span data-i18n="ignoreCase">忽略大小写</span></label>
      <label class="check"><input type="checkbox" id="opt-collapse"><span data-i18n="collapse">折叠未改动</span></label>
      <div class="grow"></div>
      <span class="stats" id="stats" aria-live="polite"></span>
      <div class="actions">
        <button class="btn small" id="prev-btn" type="button" title="上一处 (k)" data-i18n-title="prev" data-i18n-aria="prev">↑</button>
        <button class="btn small" id="next-btn" type="button" title="下一处 (j)" data-i18n-title="next" data-i18n-aria="next">↓</button>
        <button class="btn small" id="copy-btn" type="button" data-i18n="copy">复制 patch</button>
        <button class="btn small" id="download-btn" type="button" data-i18n="download">下载</button>
        <button class="btn small primary" id="share-btn" type="button" data-i18n="share">分享链接</button>
      </div>
    </section>

    <section class="output" id="output"></section>
  </main>

  <footer data-i18n="footer">
    数据只在你的浏览器里处理，不会上传。分享链接把内容压缩进 URL 的 # 部分，同样不经过服务器。
  </footer>

  <div class="drop-hint" id="drop-hint" data-i18n="dropHint">松开以载入文件（一次拖两个文件可分别放到左右两侧）</div>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
